[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "giga-embeddings-mlx"
dynamic = ["version"]
description = "Native MLX runtime for the Giga Embeddings 0826 model family"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "MIT"
authors = [{ name = "Maksim Popkov" }]
dependencies = [
  "huggingface-hub>=1.3,<2",
  "mlx>=0.32.2,<0.33",
  "mlx-lm>=0.31.3,<0.32",
  "numpy>=2.3,<3",
  "safetensors>=0.7,<0.9",
  "transformers>=5.14,<6",
]

[project.optional-dependencies]
reference = [
  "sentence-transformers>=6,<7",
  "torch>=2.8,<3",
]
evaluation = [
  "mteb>=2.20,<3",
  "scipy>=1.17,<2",
]
server = [
  "fastapi>=0.140,<1",
  "uvicorn>=0.52,<1",
]

[project.scripts]
giga-embeddings-mlx = "giga_embeddings_mlx.cli:main"

[tool.hatch.version]
path = "src/giga_embeddings_mlx/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/giga_embeddings_mlx"]

